<!doctype html>

<title>NF STUDIO — image de partage (1200×630)</title>
<style>
@font-face { font-family: "SG"; src: url("../src/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
@font-face { font-family: "PM"; src: url("../src/assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #F5F3EE; color: #1C1F22; font-family: "SG", sans-serif; position: relative; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(circle, #DDD7CA 1.2px, transparent 1.5px); background-size: 20px 20px; background-position: 10px 10px; }
.frame { position: absolute; inset: 40px; border: 1px solid #D8D2C4; }
.frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: solid #1C1F22; }
.frame::before { top: -1px; left: -1px; border-width: 1.5px 0 0 1.5px; }
.frame::after { bottom: -1px; right: -1px; border-width: 0 1.5px 1.5px 0; }
.text { position: absolute; left: 88px; top: 84px; width: 700px; }
.logo { display: flex; align-items: center; font-weight: 800; font-size: 30px; letter-spacing: .01em; }
.logo i { width: 13px; height: 13px; background: #D2491B; margin-right: 14px; }
.logo span { font-weight: 500; letter-spacing: .08em; margin-left: 9px; }
h1 { margin: 74px 0 0; font-size: 84px; line-height: .95; letter-spacing: -0.045em; font-weight: 850; }
h1 span { display: block; color: #5C6166; }
.kicker { position: absolute; left: 88px; bottom: 84px; font-family: "PM", monospace; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: #B23C12; display: flex; align-items: center; gap: 14px; }
.kicker::before { content: ""; width: 32px; height: 1.5px; background: #D2491B; }
svg { position: absolute; right: 88px; top: 92px; }
svg text { font-family: "PM", monospace; }
.n rect { fill: #F5F3EE; stroke: #1C1F22; stroke-width: 1.6; }
.n.a rect { stroke: #D2491B; stroke-width: 2; }
.n .f { fill: #D2491B; stroke: none; }
.l { font-size: 15px; letter-spacing: .06em; fill: #1C1F22; }
.w { fill: none; stroke: #1C1F22; stroke-width: 1.6; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="frame"></div>
<div class="text">
  <div class="logo"><i></i>NF<span>STUDIO</span></div>

</div>
<p class="kicker">Logiciels métier &amp; automatisation</p>

  <g class="n"><rect x="1" y="373" width="250" height="64"/><text class="l" x="22" y="411">LOGICIEL MÉTIER</text></g>
